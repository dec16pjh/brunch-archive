---
layout: default
---
<article class="book-index">
  <nav class="crumbs"><a href="{{ '/' | relative_url }}">홈</a> · {{ page.genre | escape }}</nav>
  <h1 class="book-title">{{ page.title | escape }}</h1>
  <p class="book-meta">{{ page.author | escape }} · {{ page.release_date }}</p>
  <div class="book-intro">
    {{ content }}
  </div>
</article>
